<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

<div class="formWrapper">
	<h1>Official ECSS HackStart Feedback Form™</h1>
    <h2 class="formHeader">Enter your name and university email</h2>

    <form method="POST" action="/page2">
        <label class="inputLabel" for="name">Name</label>
        <input
			class="formInput formInputText"
            type="password"
            id="name"
            name="name"
            placeholder="Enter name"
            required
        >

        <label class="inputLabel" for="name">ID number</label>
		<label>30000000</label>
		<label style="float:right;">39000000</label>
        <input
			class="formInput formInputText"
            type="range"
            id="name"
            name="name"
			min="30000000"
			max="39000000"
            required
        >

        <label class="inputLabel" for="email">Email</label>
        <input
			class="formInput formInputText"
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <button class="retryButton" type="submit">Next</button>
    </form>
</div>

</body>
</html>
