<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

<div class="formWrapper">
    <h1 class="formHeader">Enter A Secondery Email</h1>

    <form method="POST" action="/page5">
        
        <input type="hidden"
        name="email_original"
        value="{{email}}"
        >
        <label class="inputLabel" for="email">Email</label>
        <input
			class="formInput formInputText"
            type="email"
            id="email"
            name="second_email"
            placeholder="Enter Secondery Email"
            required
        >
		<label>&nbsp Accept marketing emails</label>
		<img src="{{ url_for('static', filename='checkbox.png') }}" style="float:left"/>

       <div id="button-grid">
            <button class="submitButton" type="submit">Submit</button>
            <a href="/"><button class="submitButton">Retry</button></a>
        </div>
    </form>
</div>

</body>
</html>
